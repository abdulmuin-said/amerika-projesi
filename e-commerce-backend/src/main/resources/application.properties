spring.application.name=novacanvas-backend
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/novacanvas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-1

# Email (Spring Mail) Configuration
# By default, uses standard SMTP (e.g. Gmail, Resend, SendGrid, Amazon SES, or Mailpit)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:concierge@novacanvas.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.protocol=smtp
spring.mail.from=${SPRING_MAIL_FROM:NovaCanvas Studios <concierge@novacanvas.com>}

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Jackson Serialization
spring.jackson.serialization.fail-on-empty-beans=false

# Application Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# PayTR Payment Gateway (Primary & sole provider for TR ₺ and US/Global $)
paytr.merchant-id=${PAYTR_MERCHANT_ID:}
paytr.merchant-key=${PAYTR_MERCHANT_KEY:}
paytr.merchant-salt=${PAYTR_MERCHANT_SALT:}
paytr.test-mode=${PAYTR_TEST_MODE:1}
paytr.callback-url=${PAYTR_CALLBACK_URL:http://localhost:8080/paytr/callback}
paytr.timeout-limit=30

# Stripe Payment Gateway (Legacy / Deprecated)
stripe.api-key=${STRIPE_SECRET_KEY:sk_test_mock_secret_key_for_demo}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_mock_publishable_key_for_demo}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_mock_webhook_secret}
stripe.frontend-url=${FRONTEND_URL:http://localhost:3000}